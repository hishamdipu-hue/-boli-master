name: Build BOLI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out BOLI
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build BOLI web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Create Android launcher icon from the BOLI shell artwork
        run: |
          python3 -m pip install --quiet cairosvg pillow
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          import cairosvg
          from PIL import Image
          from io import BytesIO
          svg = open('public/boli-icon.svg', 'rb').read()
          png = cairosvg.svg2png(bytestring=svg, output_width=512, output_height=512)
          icon = Image.open(BytesIO(png)).convert('RGBA')
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density, size in sizes.items():
              folder = f'android/app/src/main/res/mipmap-{density}'
              os.makedirs(folder, exist_ok=True)
              icon.resize((size,size), Image.Resampling.LANCZOS).save(f'{folder}/boli_icon.png')
          path = 'android/app/src/main/AndroidManifest.xml'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(path)
          app = tree.getroot().find('application')
          if app is None: raise SystemExit('Android application element not found')
          app.set('{http://schemas.android.com/apk/res/android}icon', '@mipmap/boli_icon')
          app.set('{http://schemas.android.com/apk/res/android}roundIcon', '@mipmap/boli_icon')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY

      - name: Register BOLI authentication deep link
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = 'android/app/src/main/AndroidManifest.xml'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(path)
          root = tree.getroot()
          ns = {'android': 'http://schemas.android.com/apk/res/android'}
          activity = root.find(".//activity[@android:name='.MainActivity']", ns)
          if activity is None:
              activity = root.find('.//activity', ns)
          if activity is None:
              raise SystemExit('Main Android activity was not found')
          activity.set('{http://schemas.android.com/apk/res/android}launchMode', 'singleTask')
          intent = ET.SubElement(activity, 'intent-filter')
          ET.SubElement(intent, 'action', {'{http://schemas.android.com/apk/res/android}name': 'android.intent.action.VIEW'})
          ET.SubElement(intent, 'category', {'{http://schemas.android.com/apk/res/android}name': 'android.intent.category.DEFAULT'})
          ET.SubElement(intent, 'category', {'{http://schemas.android.com/apk/res/android}name': 'android.intent.category.BROWSABLE'})
          ET.SubElement(intent, 'data', {'{http://schemas.android.com/apk/res/android}scheme': 'com.boli.vessel', '{http://schemas.android.com/apk/res/android}host': 'auth', '{http://schemas.android.com/apk/res/android}path': '/callback'})
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY

      - name: Sync BOLI into Android
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOLI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
